name: Build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-amd64
            cgo: '0'
          - os: ubuntu-22.04
            target: linux-amd64
            cgo: '1'
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
      GOFLAGS: -mod=readonly
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install Gio dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev \
            libffi-dev libxcursor-dev libxfixes-dev libvulkan-dev

      - name: Verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build all packages
        run: go build ./...

      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin/package, bin/dist | Out-Null
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o bin/package/WazzapClients.exe ./cmd/wazzap
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path bin/package/WazzapClients.exe -DestinationPath bin/dist/WazzapClients-windows-amd64.zip

      - name: Package Linux executable
        if: runner.os == 'Linux'
        run: |
          mkdir -p bin/package bin/dist
          go build -trimpath -ldflags '-s -w' -o bin/package/wazzapclients ./cmd/wazzap
          tar -czf bin/dist/WazzapClients-linux-amd64.tar.gz -C bin/package wazzapclients

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: WazzapClients-${{ matrix.target }}
          path: bin/dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download build packages
        uses: actions/download-artifact@v8
        with:
          pattern: WazzapClients-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum WazzapClients-windows-amd64.zip WazzapClients-linux-amd64.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [ "$draft" != 'true' ]; then
              echo 'Release already published; refusing to replace its assets.' >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag --draft --generate-notes --title "WazzapClients $RELEASE_TAG"
          fi
